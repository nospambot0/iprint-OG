name: Build OpenThermal Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Verify clean source files
        shell: pwsh
        run: |
          if (!(Test-Path 'app/main.py')) { throw 'app/main.py is missing.' }
          if (!(Test-Path 'app/requirements.txt')) { throw 'app/requirements.txt is missing.' }
          python -m py_compile app/main.py

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt
          python -m pip install pyinstaller

      - name: Build standalone EXE
        shell: pwsh
        run: |
          Set-Location app
          pyinstaller --noconfirm --clean --onefile --windowed --name OpenThermal --collect-all PySide6 --collect-all bleak main.py
          if (!(Test-Path 'dist/OpenThermal.exe')) { throw 'OpenThermal.exe was not created.' }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenThermal-Windows-x64
          path: app/dist/OpenThermal.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish EXE as GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: OpenThermal Windows build ${{ github.run_number }}
          body: |
            Windows x64 OpenThermal BLE discovery and GATT inspection application.
            Printing remains disabled pending verification of the printer's firmware transfer protocol.
          prerelease: true
          make_latest: false
          files: app/dist/OpenThermal.exe
