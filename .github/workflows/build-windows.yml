name: Build OpenThermal Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Extract and verify source archive
        shell: pwsh
        run: |
          python -c "import zipfile; z=zipfile.ZipFile('OpenThermal-Windows-Source.zip'); print('Archive entries:'); print('\n'.join(z.namelist())); z.extractall('source')"
          $main = Get-ChildItem -Path source -Filter main.py -File -Recurse | Select-Object -First 1
          $req = Get-ChildItem -Path source -Filter requirements.txt -File -Recurse | Select-Object -First 1
          if (-not $main -or -not $req) {
            Get-ChildItem -Path source -Recurse | Select-Object -ExpandProperty FullName
            throw 'Archive does not contain both main.py and requirements.txt.'
          }
          "PROJECT_DIR=$($main.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Found application entry point at $($main.FullName)"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:PROJECT_DIR/requirements.txt"
          python -m pip install pyinstaller

      - name: Build standalone EXE
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_DIR"
          pyinstaller --noconfirm --clean --onefile --windowed --name OpenThermal --collect-all bleak --collect-all winrt main.py
          if (!(Test-Path 'dist/OpenThermal.exe')) { throw 'OpenThermal.exe was not created.' }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenThermal-Windows-x64
          path: ${{ env.PROJECT_DIR }}/dist/OpenThermal.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish EXE as GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: OpenThermal Windows build ${{ github.run_number }}
          body: |
            Standalone Windows x64 executable built from `${{ github.sha }}`.

            BLE discovery, connection, GATT inspection and notification monitoring for SC03h/iPrint-family printers. Printing remains disabled pending exact firmware transfer-mode verification.
          prerelease: true
          make_latest: false
          files: ${{ env.PROJECT_DIR }}/dist/OpenThermal.exe
