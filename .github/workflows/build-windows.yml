name: Build OpenThermal Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Extract source
        shell: pwsh
        run: |
          Expand-Archive -Path OpenThermal-Windows-Source.zip -DestinationPath .
          $project = Get-ChildItem -Path . -Directory -Recurse | Where-Object { (Test-Path (Join-Path $_.FullName 'main.py')) -and (Test-Path (Join-Path $_.FullName 'requirements.txt')) } | Select-Object -First 1
          if (-not $project) {
            Get-ChildItem -Path . -Recurse | Select-Object -ExpandProperty FullName
            throw 'Could not locate extracted project folder containing main.py and requirements.txt.'
          }
          "PROJECT_DIR=$($project.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Found project at $($project.FullName)"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:PROJECT_DIR/requirements.txt"
          python -m pip install pyinstaller

      - name: Build standalone EXE
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_DIR"
          pyinstaller --noconfirm --clean --onefile --windowed --name OpenThermal --collect-all bleak --collect-all winrt main.py
          if (!(Test-Path 'dist/OpenThermal.exe')) { throw 'OpenThermal.exe was not created.' }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenThermal-Windows-x64
          path: ${{ env.PROJECT_DIR }}/dist/OpenThermal.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish EXE as GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: OpenThermal Windows build ${{ github.run_number }}
          body: |
            Standalone Windows x64 executable built from `${{ github.sha }}`.

            BLE discovery, connection, GATT inspection and notification monitoring for SC03h/iPrint-family printers. Printing remains disabled pending exact firmware transfer-mode verification.
          prerelease: true
          make_latest: false
          files: ${{ env.PROJECT_DIR }}/dist/OpenThermal.exe
